name: Zbuduj APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rozpakuj i zbuduj
        run: |
          ls -la
          COUNT=$(ls *.zip 2>/dev/null | wc -l)
          if [ "$COUNT" -ne 1 ]; then echo "BŁĄD: w repo musi być dokładnie 1 plik .zip, jest: $COUNT"; ls *.zip; exit 1; fi
          unzip -o *.zip -d rozpakowane
          cd "$(dirname "$(find rozpakowane -name gradlew | head -1)")"
          ls app/src/main/java/pl/duchy/spiritbox/
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SpiritBox.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SpiritBox-apk
          path: SpiritBox.apk
